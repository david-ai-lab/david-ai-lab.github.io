<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David R. — en construcción</title>
  <meta name="description" content="Página personal de David R., en construcción.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2563eb;
      --border: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --fg: #f2f2f2;
        --muted: #9a9a9a;
        --accent: #60a5fa;
        --border: #2a2d33;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 480px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: clamp(26px, 6vw, 36px);
      margin: 0 0 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    a.github {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      transition: border-color 0.15s ease;
    }
    a.github:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    a.github svg { width: 18px; height: 18px; fill: currentColor; }
    .bot {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      line-height: 1.15;
      color: var(--accent);
      margin: 0 0 6px;
      user-select: none;
      display: inline-block;
      text-align: left;
    }
    .caption {
      font-size: 13px;
      font-style: italic;
      letter-spacing: 0.02em;
      color: var(--muted);
      margin: 0 0 28px;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">En construcción</span>
    <h1>David R.</h1>
    <pre class="bot" aria-hidden="true">       |`-.__
       / ' _/
      ****`
     /    }
    /  \ /
\ /`   \\\
 `\    /_\\
  `~~~~~``~`</pre>
    <p class="caption">Old dog, new tricks.</p>
    <p>Spoiler: los proyectos llegarán en cuanto mis agentes y yo dejemos de alucinar.</p>
    <a class="github" href="https://github.com/david-ai-lab" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      github.com/david-ai-lab
    </a>
  </main>
</body>
</html>
